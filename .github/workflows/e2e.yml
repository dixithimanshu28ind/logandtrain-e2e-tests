name: E2E Smoke Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to test (defaults to the BASE_URL repo variable, then production)"
        required: false
  schedule:
    - cron: "0 6 * * *" # daily smoke run against production

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://gym-workout-logger-ashen.vercel.app' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
